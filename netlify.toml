# Solo configura la función del PILOTO BIOMÉTRICO. No define [build]: la configuración del
# sitio (publicación, rama, etc.) sigue siendo la del panel de Netlify, igual que antes.
[functions.biometria]
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/biometria/modelos/*.onnx",
    "node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm",
    "node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs",
  ]

# Aviso por correo "comenzaron los ingresos" (lo llama un disparador de Supabase; ver supabase-aviso-ingreso.sql).
[functions.aviso-ingreso]
  node_bundler = "esbuild"

# Borrado automático de las fotos de ingreso 12 h después de terminado cada evento (se ejecuta cada hora).
[functions.borrar-fotos]
  node_bundler = "esbuild"
  schedule = "@hourly"
